[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usrecon"
version = "0.1.0"
description = "Trackerless freehand ultrasound 2D-to-3D reconstruction pipeline (ACVSS26 hackathon)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
